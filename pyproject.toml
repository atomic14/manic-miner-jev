[project]
name = "jev-manic"
version = "0.1.0"
description = "jev plays Manic Miner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pybind11>=3.1.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
